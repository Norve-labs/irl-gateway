name: Release

# Push a tag like v0.2.0 -> test, build, publish to PyPI (Trusted Publishing,
# no stored token), then list the server in the official MCP Registry
# (GitHub OIDC, no stored token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag $TAG != pyproject $VERSION"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" server.json || { echo "server.json version mismatch"; exit 1; }
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/irl-gateway/$V/json" >/dev/null && exit 0
            sleep 10
          done
          echo "irl-gateway $V not visible on PyPI"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
